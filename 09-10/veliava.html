<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Vėliava</title>
    </head>

    <style>
        body
        {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #veliava
        {
            width: 500px;
            height: 300px;
            margin: 20pt auto 20pt auto;
        }

        #geltona, #zalia, #raudona { height: 100px; }

        #geltona { background-color: #FDB913; }
        #zalia { background-color: #006A44; }
        #raudona { background-color: #C1272D; }

        hr
        {
            width: 60%;
            height: 2px;
            background-color: #AAAAAA;
            border: 0;
        }

        address
        {
            text-align: center;
            font-size: 75%;
        }
    </style>

    <body>
        <div id="veliava">
            <div id="geltona"></div>
            <div id="zalia"></div>
            <div id="raudona"></div>
        </div>

        <footer>
            <hr>
            <address>2026 &copy; Lukas Mikalauskas</address>
        </footer>
    </body>
</html>
